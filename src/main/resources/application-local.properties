# Updated Database Connection Settings
# Added parameters for timezones and public key retrieval
# Pura class path dene ki bajaye sirf plugin ka naam use karein
spring.datasource.url=jdbc:mysql://localhost:3307/gargweb_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&defaultAuthenticationPlugin=mysql_native_password

spring.datasource.username=root
spring.datasource.password=root

# Baki settings same rahengi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Optional: Connection Pool Settings for stability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

server.port=8080